        <script>
            // iPad/iPhone/Android auto-redirect to mobile app - runs BEFORE React
            // CRITICAL: PUBLIC routes (builder portal, customer portals, questionnaires) must
            // NEVER redirect to the admin mobile app — those links are shared with external
            // builders/clients who must NOT see admin/pricing data.
            (function() {
                var path = window.location.pathname;
                var PUBLIC_PREFIXES = ['/mobile-app', '/customer', '/builder', '/test-questionnaire'];
                for (var p = 0; p < PUBLIC_PREFIXES.length; p++) {
                    if (path.indexOf(PUBLIC_PREFIXES[p]) === 0) return;
                }
                var ua = navigator.userAgent;
                // Windows desktops/laptops (incl. Microsoft Surface 2-in-1s with touchscreens)
                // must always render the desktop app, even though they report touch + coarse
                // pointer. Bail early on any Windows UA.
                if (/Windows/i.test(ua)) return;
                var isMobile = /iPad|iPhone|iPod|Android|webOS|BlackBerry/i.test(ua);
                var isIPad = ua.indexOf('Macintosh') > -1 && navigator.maxTouchPoints > 1;
                var isTouch = ('ontouchend' in document);
                var isCoarsePointer = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
                if (isMobile || isIPad || (isTouch && navigator.maxTouchPoints > 1) || isCoarsePointer) {
                    window.location.replace('/mobile-app');
                }
            })();
        </script>
