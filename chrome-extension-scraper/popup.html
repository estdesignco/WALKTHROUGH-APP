<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 220px;
      padding: 15px;
      font-family: -apple-system, sans-serif;
      background: #1a1a2e;
      color: #fff;
      margin: 0;
    }
    .main-btn {
      width: 100%;
      padding: 16px;
      background: #4ade80;
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .main-btn:hover { background: #22c55e; }
    .main-btn:disabled { background: #444; color: #888; }
    .status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
    }
    .success { background: #166534; color: #4ade80; }
    .error { background: #7f1d1d; color: #fca5a5; }
  </style>
</head>
<body>
  <button id="btn" class="main-btn">⚡ ADD TO APP</button>
  <div id="status" class="status" style="display:none"></div>
  <script src="popup.js"></script>
</body>
</html>
