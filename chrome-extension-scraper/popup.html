<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 260px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      margin: 0;
    }
    h2 {
      margin: 0 0 12px 0;
      color: #4ade80;
      font-size: 15px;
    }
    .main-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .main-btn:hover {
      opacity: 0.9;
    }
    .main-btn:disabled {
      background: #444;
      color: #888;
    }
    .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      text-align: center;
    }
    .status.success { background: rgba(16, 185, 129, 0.2); color: #4ade80; }
    .status.error { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
    .status.loading { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }
    .instructions {
      margin-top: 12px;
      font-size: 11px;
      color: #888;
      line-height: 1.5;
    }
    .price-display {
      margin-top: 10px;
      padding: 12px;
      background: rgba(74, 222, 128, 0.1);
      border-radius: 8px;
      text-align: center;
    }
    .price-label { font-size: 11px; color: #888; }
    .price-value { font-size: 24px; color: #4ade80; font-weight: 700; }
  </style>
</head>
<body>
  <h2>🛒 Price Scraper</h2>
  
  <button id="mainBtn" class="main-btn">⚡ SCRAPE THIS PAGE</button>
  
  <div id="status" class="status" style="display: none;"></div>
  
  <div id="priceDisplay" class="price-display" style="display: none;">
    <div class="price-label">Wholesale Price</div>
    <div id="priceValue" class="price-value">$0</div>
  </div>
  
  <div class="instructions">
    <strong>How to use:</strong><br>
    1. Click SCRAPE on product page<br>
    2. Copy the URL from browser<br>
    3. Paste URL into Add Item modal<br>
    → Price will auto-populate!
  </div>

  <script src="popup.js"></script>
</body>
</html>
